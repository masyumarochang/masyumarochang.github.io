<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何の変哲もないサイト</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>*何の変哲もないサイト*</h1>

    <marquee>ようこそ！特に何もありません！</marquee>
    
    <div id="text">読み込み中…</div>

    <p>↑押しても大したことなんて起きないからね？？↑</p>

    <button>何の意味もないボタン</button>

    <div id="secret">見つかった！？ちなみに、デカ文字文章は時間帯によって変わるからまた見に来てね。</div>

    <div class="box">
        <p>▼選んでみよう</p>
        <select id="useless">
            <option>選択してください</option>
            <option>食</option>
            <option>満</option>
            <option>留</option>
            <option>三</option>
            <option>郎</option>
        </select>

        <p id="reaction" class="small"></p>
    </div>

    <div class="box">
        <p id="grow">→この文字をタップしてみよう！←</p>
    </div>
    
    <hr>

    <small>※Live2Dやった後の有り余るプログラミング欲で出来たサイトです。</small>

    <script src="script.js"></script>
</body>
</html>
